[package]
authors = ["Simon Bernier St-Pierre <git@sbstp.ca>"]
categories = ["command-line-utilities", "development-tools"]
description = "A more powerful alternative to kubectx and kubens. Fork with remote provider discovery and secret injection."
documentation = "https://github.com/gfx-labs/kubie/blob/master/README.md"
edition = "2021"
exclude = ["releases/**/*"]
homepage = "https://github.com/gfx-labs/kubie"
keywords = ["kubernetes", "kubectx", "kubens"]
license = "Zlib"
name = "kubie"
readme = "README.md"
repository = "https://github.com/gfx-labs/kubie"
version = "2026.5.2"

[dependencies]
anyhow = "1"
clap = { version = "4.5.60", features = ["derive"] }
clap_complete = "4.6.0"
cfg-if = "1"
crossterm = "0.29"
dirs = "6"
fs2 = "0.4"
glob = "0.3"
lazy_static = "1"
libc = "0.2"
nucleo-matcher = "0.3"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
strsim = "0.11"
serde_json = "1"
serde_yaml = "0.9"
signal-hook = "0.4"
tempfile = "3"
unicode-width = "0.2"
which = "8"
mimalloc = "0.1"
wildmatch = "2"

# Remote provider dependencies (optional, behind "remote" feature)
colored = { version = "3", optional = true }
ureq = { version = "3", optional = true }

[target.arm-unknown-linux-musleabi.dependencies]
aws-lc-rs = { version = "1.16", default-features = false, features = [
    "aws-lc-sys",
    "prebuilt-nasm",
    "bindgen",
] }

[dependencies.attohttpc]
default-features = false
features = ["compress", "json", "tls-rustls-native-roots"]
version = "0.30.1"
optional = true

[features]
update = ["attohttpc"]
remote = ["colored", "ureq"]
default = ["update", "remote"]

[profile.release]
codegen-units = 16
lto = "thin"
opt-level = "s"
strip = true

[dev-dependencies]
strsim = "0.11"

