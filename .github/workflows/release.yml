name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            asset: kubie-linux-amd64
            cross: false
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            asset: kubie-linux-arm64
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            asset: kubie-darwin-amd64
            cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            asset: kubie-darwin-arm64
            cross: false

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Install musl-tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build (native)
        if: "!matrix.cross"
        run: cargo build --release --target ${{ matrix.target }}
        env:
          SDKROOT: /Library/Developer/CommandLineTools/SDKs/MacOSX.sdk
          MACOSX_DEPLOYMENT_TARGET: "11.0"

      - name: Build (cross)
        if: matrix.cross
        run: |
          # Clear local .cargo/config.toml linker settings that assume clang+mold
          rm -f .cargo/config.toml
          cross build --release --target ${{ matrix.target }}

      - name: Package binary
        run: |
          cp target/${{ matrix.target }}/release/kubie ${{ matrix.asset }}
          chmod +x ${{ matrix.asset }}
          if command -v sha256sum &>/dev/null; then
            sha256sum ${{ matrix.asset }} > ${{ matrix.asset }}.sha256
          else
            shasum -a 256 ${{ matrix.asset }} > ${{ matrix.asset }}.sha256
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*

      - name: Update release branch
        run: git push origin HEAD:refs/heads/release --force
